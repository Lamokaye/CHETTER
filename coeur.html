<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 Happy Birthday ! 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Particules magiques */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            animation: float 6s linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1) rotate(360deg);
                opacity: 0;
            }
        }

        /* Conteneur principal */
        .container {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        /* Cœur 3D principal */
        .heart-container {
            perspective: 1000px;
            margin-bottom: 2rem;
        }

        .heart-3d {
            width: 300px;
            height: 280px;
            position: relative;
            transform-style: preserve-3d;
            animation: heartBeat 1.5s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .heart-3d:hover {
            transform: rotateY(10deg) rotateX(10deg) scale(1.1);
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1) rotateX(0deg); }
            14% { transform: scale(1.3) rotateX(5deg); }
            28% { transform: scale(1) rotateX(-3deg); }
            42% { transform: scale(1.3) rotateX(5deg); }
            70% { transform: scale(1) rotateX(0deg); }
        }

        .heart {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #ff1744, #ff6b9d, #ff8fab);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            animation: heartGlow 2s ease-in-out infinite alternate;
            box-shadow: 
                0 0 50px rgba(255, 23, 68, 0.6),
                inset 0 0 50px rgba(255, 255, 255, 0.2);
        }

        @keyframes heartGlow {
            from { 
                box-shadow: 
                    0 0 50px rgba(255, 23, 68, 0.6),
                    inset 0 0 50px rgba(255, 255, 255, 0.2);
            }
            to { 
                box-shadow: 
                    0 0 100px rgba(255, 23, 68, 0.9),
                    inset 0 0 80px rgba(255, 255, 255, 0.4);
            }
        }

        /* Texte principal */
        .birthday-text {
            font-family: 'Dancing Script', cursive;
            font-size: 4.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #fff, #f0f0f0, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            text-shadow: 0 0 30px rgba(255,255,255,0.8);
            animation: textGlow 3s ease-in-out infinite alternate;
            position: relative;
        }

        @keyframes textGlow {
            from { 
                text-shadow: 0 0 20px rgba(255,255,255,0.5), 0 0 40px rgba(255, 23, 68, 0.3);
            }
            to { 
                text-shadow: 0 0 30px rgba(255,255,255,0.8), 0 0 60px rgba(255, 23, 68, 0.6);
            }
        }

        .name-input {
            font-size: 2rem;
            padding: 1rem 2rem;
            border: 3px solid rgba(255,255,255,0.5);
            border-radius: 50px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(20px);
            color: white;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            text-align: center;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
            width: 350px;
            max-width: 90vw;
        }

        .name-input:focus {
            outline: none;
            border-color: #ff1744;
            box-shadow: 0 0 30px rgba(255, 23, 68, 0.5);
            transform: scale(1.05);
        }

        .name-input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        /* Message personnalisé */
        .personal-message {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .personal-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Boutons */
        .action-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-special {
            padding: 1rem 2.5rem;
            background: linear-gradient(45deg, #ff1744, #ff6b9d);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(255, 23, 68, 0.4);
        }

        .btn-special:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 40px rgba(255, 23, 68, 0.6);
        }

        .btn-special:active {
            transform: translateY(-2px);
        }

        /* Confettis */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff1744;
            pointer-events: none;
            z-index: 20;
            animation: confettiFall 3s linear infinite;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Musique */
        .music-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .music-toggle:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .birthday-text {
                font-size: 3rem;
            }
            
            .heart-3d {
                width: 250px;
                height: 230px;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <!-- Contrôle musique -->
    <button class="music-toggle" id="musicToggle" onclick="toggleMusic()">
        <i class="fas fa-music"></i>
    </button>

    <!-- Audio caché -->
    <audio id="birthdayMusic" loop>
        <!-- Remplacez par votre fichier MP3 -->
        <!-- <source src="happy-birthday.mp3" type="audio/mpeg"> -->
    </audio>

    <!-- Particules -->
    <div class="particles" id="particles"></div>

    <!-- Contenu principal -->
    <div class="container">
        <div class="heart-container">
            <div class="heart-3d" onclick="explodeConfetti()">
                <div class="heart"></div>
            </div>
        </div>
        
        <h1 class="birthday-text" id="birthdayText">Happy Birthday !</h1>
        
        <input type="text" class="name-input" id="nameInput" 
               placeholder="Tape ton prénom..." 
               maxlength="20" 
               oninput="updateMessage()">
        
        <div class="personal-message" id="personalMessage">
            Joyeux anniversaire <span id="nameDisplay"></span> ! 🎉🥳🎂
        </div>
        
        <div class="action-buttons">
            <button class="btn-special" onclick="celebrate()">
                <i class="fas fa-gift"></i> Célébrer !
            </button>
            <button class="btn-special" onclick="shareJoy()">
                <i class="fas fa-share-alt"></i> Partager la joie
            </button>
        </div>
    </div>

    <script>
        let isMusicPlaying = false;
        let celebrationActive = false;

        // Générer particules
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            setInterval(() => {
                for (let i = 0; i < 5; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                    particle.style.animationDelay = Math.random() * 2 + 's';
                    particlesContainer.appendChild(particle);
                    
                    setTimeout(() => particle.remove(), 6000);
                }
            }, 300);
        }

        // Message personnalisé
        function updateMessage() {
            const name = document.getElementById('nameInput').value.trim();
            const message = document.getElementById('personalMessage');
            const nameDisplay = document.getElementById('nameDisplay');
            
            if (name) {
                nameDisplay.textContent = name;
                message.classList.add('show');
            } else {
                message.classList.remove('show');
            }
        }

        // Célébration
        function celebrate() {
            if (celebrationActive) return;
            celebrationActive = true;
            
            explodeConfetti(50);
            document.body.style.animation = 'none';
            setTimeout(() => {
                document.body.style.animation = 'gradientBG 15s ease infinite';
            }, 100);
            
            // Fireworks effect
            for (let i = 0; i < 20; i++) {
                setTimeout(() => explodeConfetti(10), i * 200);
            }
            
            setTimeout(() => celebrationActive = false, 5000);
        }

        // Confettis explosion
        function explodeConfetti(count = 20) {
            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.background = `hsl(${Math.random() * 360}, 70%, 60%)`;
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 4000);
            }
        }

        // Musique
        function toggleMusic() {
            const music = document.getElementById('birthdayMusic');
            const toggle = document.getElementById('musicToggle');
            
            if (isMusicPlaying) {
                music.pause();
                toggle.innerHTML = '<i class="fas fa-music"></i>';
                isMusicPlaying = false;
            } else {
                music.play().catch(e => console.log('Audio bloqué par navigateur'));
                toggle.innerHTML = '<i class="fas fa-volume-up"></i>';
                isMusicPlaying = true;
            }
        }

        // Partager
        function shareJoy() {
            const name = document.getElementById('nameInput').value.trim() || 'toi';
            const message = `🎉 Joyeux anniversaire ${name} ! Regarde cette carte spéciale : ${window.location.href}`;
            
            if (navigator.share) {
                navigator.share({
                    title: 'Happy Birthday ! 🎂',
                    text: message,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(message).then(() => {
                    alert('🎉 Message copié ! Partage-le avec tes amis 💖');
                });
            }
        }

        // Initialisation
        window.addEventListener('load', () => {
            createParticles();
            document.getElementById('nameInput').focus();
        });

        // Clic cœur = explosion
        document.querySelector('.heart-3d').addEventListener('click', () => {
            explodeConfetti(30);
        });

        // Auto-célébration après 5s
        setTimeout(() => {
            if (document.getElementById('nameInput').value.trim()) {
                celebrate();
            }
        }, 5000);
    </script>
</body>
</html>
